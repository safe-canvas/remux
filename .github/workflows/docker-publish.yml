name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

env:
  JELLYFIN_WEB_TAG: v12.1

jobs:
  push_to_ghcr:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # ---- jellyfin-web (built, then placed at ./jellyfin-web) ----
      - name: Checkout jellyfin-web
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: ${{ env.JELLYFIN_WEB_TAG }}
          path: jellyfin-web-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jellyfin-web-src/package-lock.json

      - name: Build jellyfin-web
        working-directory: jellyfin-web-src
        run: |
          npm ci
          npm run build:production
          mv dist ../jellyfin-web

      # ---- Rust toolchain + caches ----
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # ---- Dashboard (built, then placed at ./dashboard) ----
      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --no-confirm --force --locked

      - name: Build dashboard
        working-directory: crates/remux-dashboard
        run: ~/.cargo/bin/dx build --release

      - name: Stage dashboard
        run: cp -r target/dx/remux-dashboard/release/web/public dashboard

      # ---- Server binary (placed at ./remux-server) ----
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p remux-server
          cp target/x86_64-unknown-linux-gnu/release/remux-server remux-server
          chmod +x remux-server

      # ---- Docker image ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
